<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PokéMarketIndex</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e53935, #ff7043, #ffffff);
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pokedex {
      width: 92%;
      height: 92vh;
      background: #f5f5f5;
      border: 8px solid #cc0000;
      border-radius: 24px;
      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.35),
        inset 0 0 0 4px #ffcc00;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(90deg, #cc0000, #ff3b30, #cc0000);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.25);
    }

    .pokeball {
      width: 35px;
      height: 35px;
      background: linear-gradient(
        to bottom,
        #ff3030 0%,
        #ff3030 45%,
        #222 45%,
        #222 55%,
        #fff 55%,
        #fff 100%
      );
      border: 3px solid #222;
      border-radius: 50%;
      position: relative;
    }

    .pokeball::after {
      content: "";
      position: absolute;
      width: 11px;
      height: 11px;
      background: white;
      border: 3px solid #222;
      border-radius: 50%;
      top: 9px;
      left: 9px;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .iframe-container {
      flex: 1;
      padding: 12px;
      background: #eeeeee;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
      background: white;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.25);
    }

    .footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 8px;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="pokedex">

    <div class="header">
      <div class="pokeball"></div>
      <div class="title">Pokédex</div>
    </div>

    <div class="iframe-container">

      <!-- Literal iframe -->
      <iframe
        src="https://en.wikipedia.org/wiki/Pok%C3%A9mon"
        title="PokéMarketIndex">
      </iframe>

    </div>

    <div class="footer">
      Pokémon Pokédex
    </div>

  </div>

</body>
</html>
